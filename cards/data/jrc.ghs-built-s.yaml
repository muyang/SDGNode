# SDGNode 首批卡 · 全球专题产品（管线 2）—— SDG 11.3.1 官方推荐（GHSL）
geocard_version: "1.0"
id: sdg.data.jrc.ghs-built-s
type: data
name: JRC GHSL GHS-BUILT-S R2023A（全球建成区面积，多时相）
description: >-
